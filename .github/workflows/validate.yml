name: Validate game project
on:
  push:
    branches: ["main", "fix/comprehensive-audit-baseline"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax-check browser JavaScript
        run: |
          for file in backend-config.js app.js social.js online-games.js progression.js hussaini-audio.js ai-companions.js sw.js; do
            node --check "$file"
          done
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/room-engine-v2/index.ts && deno check supabase/functions/ai-companions/index.ts
      - name: Validate game project, assets, SQL hardening, and registry
        run: node scripts/validate-project.js
