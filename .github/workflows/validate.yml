name: Validate game project
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript, assets, game registry, and engine security
        run: node scripts/validate-project.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated room engine and Oras assistant
        run: deno check supabase/functions/room-engine/index.ts supabase/functions/wanasa-ai/index.ts supabase/functions/wanasa-tts/index.ts
      - name: Test shared slower motion on every game surface
        run: node scripts/test-game-motion.js
      - name: Test local double-six domino rules and side selection
        run: node scripts/test-domino-practice.js
      - name: Test local UNO deck and missed-call rule parity
        run: node scripts/test-uno-practice.js
      - name: Test classic backgammon rules and legal move sequences
        run: node scripts/test-tavla-rules.js
      - name: Test snakes and ladders artwork and 3D dice
        run: node scripts/test-snakes-board-art.js
      - name: Test Oras game policies across every game and mode
        run: deno test supabase/functions/wanasa-ai/game-policy_test.ts
      - name: Test authoritative chess rules
        run: deno test supabase/functions/room-engine/chess-rules_test.ts
